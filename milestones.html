<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Strategy &amp; Design — the four milestones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#15284B;
    --navy-hover:rgba(21,40,75,.72);
    --gold:#E7AB2A;
    --body:#595959;
    --mute:#8A8A8A;
    --rule:rgba(21,40,75,.14);
    --hair:rgba(21,40,75,.08);
    --t02:rgba(21,40,75,.03);
    --t05:rgba(21,40,75,.05);
    --divider:#D5D9E0;
    --sans:"Libre Franklin","Segoe UI",Helvetica,Arial,sans-serif;
    --gap:14px;          /* space between cards — the arrow spans exactly this */
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:auto;}
  body{
    margin:0;background:#fff;color:var(--body);
    font-family:var(--sans);font-size:1rem;line-height:1.65;
    -webkit-font-smoothing:antialiased;
    padding:48px clamp(20px,5vw,56px) 90px;
    max-width:1060px;
  }
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  h1{font-size:1.75rem;font-weight:600;color:#000;letter-spacing:-.01em;line-height:1.25;margin:0 0 6px;}
  .standfirst{
    font-size:1.0625rem;margin:0 0 34px;padding-bottom:24px;
    border-bottom:1px solid var(--rule);max-width:66ch;
  }

/* ===========================================================
   PROGRESSION — copy from here
   =========================================================== */

  .prog{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:var(--gap);
    margin:0 0 26px;
  }

  /* the whole card is one target */
  .stage{
    position:relative;
    display:flex;flex-direction:column;
    text-align:left;width:100%;
    background:#fff;
    border:1px solid var(--rule);
    border-top:3px solid var(--navy);
    font:inherit;cursor:pointer;padding:0;
    transition:background .18s ease,border-color .18s ease;
  }
  .stage:hover{background:var(--navy-hover);border-color:var(--navy-hover);}
  .stage.on,.stage.on:hover{background:var(--navy);border-color:var(--navy);}

  .ms{flex:1 1 auto;padding:16px 15px 18px;position:relative;}
  .ms::after{      /* short divider, deliberately not full width */
    content:"";position:absolute;left:15px;bottom:0;
    width:38px;height:1px;background:var(--divider);
    transition:background .18s ease;
  }
  .stage:hover .ms::after,.stage.on .ms::after{background:rgba(255,255,255,.35);}

  .ord{
    display:block;
    font-size:.6875rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--gold);margin-bottom:7px;
  }
  .nm{
    display:block;
    font-size:1rem;font-weight:600;color:var(--navy);
    line-height:1.3;margin-bottom:8px;
    transition:color .18s ease;
  }
  .when{
    display:block;
    font-size:.8125rem;line-height:1.45;color:var(--body);
    transition:color .18s ease;
  }
  .credit{
    display:block;
    font-size:.75rem;line-height:1.4;color:var(--mute);margin-top:5px;
    transition:color .18s ease;
  }
  .stage:hover .nm,.stage.on .nm,
  .stage:hover .when,.stage.on .when{color:#fff;}
  .stage:hover .credit,.stage.on .credit{color:rgba(255,255,255,.72);}

  /* the plan band — part of the card, not its own control */
  .plan{
    position:relative;
    display:block;
    background:var(--t02);
    padding:11px 15px 12px;
    transition:background .18s ease;
  }
  .stage:hover .plan,.stage.on .plan{background:rgba(255,255,255,.1);}
  .plan .pv{
    display:block;
    font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;
    color:var(--navy);line-height:1;margin-bottom:3px;
    transition:color .18s ease;
  }
  .plan .pn{
    display:block;
    font-size:.75rem;line-height:1.3;color:var(--body);
    transition:color .18s ease;
  }
  .stage:hover .plan .pv,.stage.on .plan .pv{color:var(--gold);}
  .stage:hover .plan .pn,.stage.on .plan .pn{color:rgba(255,255,255,.8);}

  /* arrow spans the gap exactly, band edge to band edge */
  .plan::after{
    content:"";position:absolute;z-index:2;
    top:50%;margin-top:-1px;
    right:calc(var(--gap) * -1 + 6px);
    width:calc(var(--gap) - 6px);height:2px;
    background:rgba(21,40,75,.35);
    transition:background .18s ease;
  }
  .plan::before{
    content:"";position:absolute;z-index:3;
    top:50%;margin-top:-5px;
    right:calc(var(--gap) * -1);
    width:0;height:0;
    border-left:6px solid rgba(21,40,75,.35);
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    transition:border-left-color .18s ease;
  }
  .stage:last-child .plan::after,
  .stage:last-child .plan::before{display:none;}
  .stage:hover .plan::after,.stage.on .plan::after{background:var(--navy);}
  .stage:hover .plan::before,.stage.on .plan::before{border-left-color:var(--navy);}

  /* ---------- field template below ---------- */
  .detail{border-top:1px solid var(--rule);padding-top:22px;}
  .dhead{
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:18px;
  }
  .dhead h2{
    font-size:1.25rem;font-weight:600;color:var(--navy);margin:0;line-height:1.3;
  }
  .dhead .dv{
    font-size:.8125rem;color:var(--mute);
  }
  .fields{
    display:grid;grid-template-columns:1fr;
    gap:0;
  }
  .field{padding:0 0 20px;}
  .field h3{
    font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--navy);margin:0 0 8px;padding-bottom:5px;
    border-bottom:1px solid var(--rule);
  }
  .field p,.field .fb{
    margin:0;font-size:.9375rem;line-height:1.55;
  }
  .field p.todo,.field .fb.todo{
    color:var(--mute);font-style:italic;
  }

  .crit{margin:10px 0 14px;}
  .crit-row{display:grid;grid-template-columns:minmax(120px,1fr) 3fr;gap:0 24px;padding:9px 0;border-top:1px solid var(--hair);}
  .crit-head{border-top:0;font-size:.6875rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);}
  .crit-c{font-weight:600;color:var(--navy);}
  @media (max-width:520px){.crit-row{grid-template-columns:1fr;gap:2px;}}

  @media (max-width:860px){
    .prog{grid-template-columns:repeat(2,minmax(0,1fr));}
    .plan::after,.plan::before{display:none;}
    .fields{grid-template-columns:1fr;}
  }
  @media (max-width:520px){
    .prog{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;}
  }

/* ===========================================================
   end progression
   =========================================================== */
</style>
</head>
<body>


<div class="prog" id="prog"></div>
<div class="detail" id="detail" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     EDIT HERE. Each milestone has its card text and its four fields.
     The field text is placeholder — replace the strings below.
     ===================================================================== */

  function crit(head,rows){
    function r(a,b,cls){ return '<div class="crit-row'+(cls||'')+'"><div class="crit-c">'+a+'</div><div class="crit-d">'+b+'</div></div>'; }
    return '<div class="crit">'+r(head[0],head[1]," crit-head")+rows.map(function(x){return r(x[0],x[1]);}).join("")+'</div>';
  }

  var STAGES=[
    {
      ord:"Milestone 1",
      nm:"Career Exploration",
      when:"First year, spring semester",
      credit:"1 credit",
      planV:"v1.0",
      planName:"Career Exploration Plan",
      fields:{
        credits:"1 credit, additional for both colleges.",
        sequencing:"Second semester of students' first year.  Serves as 2nd credit in the 2-credit FYE sequence.",
        courses:"There are no existing courses that currently serve this specific purpose in either colleges' curricula. Below is a proposed course that could be developed and managed by the Career Center, with instructions from career advisors and faculty from across both colleges. Below that are proposed criteria that other courses would need to meet to satisfy this requirement in its place.<br><strong>CE-100: Career Exploration</strong><br>Through guided self-assessment, labor-market research, analysis of professional roles, and conversations with professionals and other students, students research multiple pathways and learn to evaluate the information informing their decisions. Students practice initiating professional relationships, develop foundational career materials, and consider how compensation, educational costs, and personal circumstances affect their choices. They complete a Career Exploration Plan documenting what they have learned, the possibilities they intend to investigate further, and specific next steps for coursework, relationships, and experience. The course prepares students to identify an appropriate field or fields for further development in CE 200.       ",
        modality:"In person, biweekly meetings for groups of ~20 students.  Instructors would have two sections of 20 students each, meeting on alternating weeks. Students would complete asynchronous assignments and reflections between meetings.",
        criteria:"A course satisfying the Career Exploration requirement must teach and assess students’ ability to:"+
          crit(["Core competency","Students must be able to…"],[
            ["Understand themselves as developing professionals","Explain how their interests, values, strengths, experiences, and circumstances inform possible academic and career directions, using evidence rather than unsupported self-description."],
            ["Investigate career possibilities","Research and compare multiple pathways, including the work involved, entry routes, qualifications, working conditions, and connections to academic study."],
            ["Interpret career information","Evaluate labor-market data, job postings, and professional perspectives; recognize their limitations; and use findings to inform decisions and identify further questions."],
            ["Learn through professional relationships","Identify relevant people, initiate purposeful conversations, ask informed questions, and follow up appropriately to deepen their understanding and connections."],
            ["Communicate emerging capabilities","Describe their skills and experiences with concrete examples and explain their potential relevance to professional settings."],
            ["Make informed, feasible choices","Consider career possibilities alongside financial realities, educational requirements, personal priorities, and available resources."],
            ["Translate exploration into action","Identify directions worth investigating further and establish specific next steps for learning, relationships, and experience."]
          ])+
          "<br>Common artifact: Career Plan 1, the Career Exploration Plan, records the student’s findings, current directions, remaining questions, and next steps. An equivalent course can use different assignments while requiring these common plan components.",
        notes:" "
        }
    },
    {
      ord:"Milestone 2",
      nm:"Career Navigation",
      when:"Summer before sophomore year, through fall of junior year",
      credit:"1 credit, new in SBS and replacing CAS201 and its analogs.",
      planV:"v2.0",
      planName:"Career Navigation Plan",
      fields:{
        credits:"1 credit  ",
        sequencing:"Summer before sophomore year (async online), through fall of junior year",
        courses:" ",
        criteria:" ",
        notes:" "
        }
    },
    {
      ord:"Milestone 3",
      nm:"Career Integration",
      when:"Sophomore spring, through the summer before senior year",
      credit:"0 to 4 credits",
      planV:"v3.0",
      planName:"Career Integration Plan",
      fields:{
        credits:" ",
        sequencing:" ",
        courses:" ",
        criteria:" ",
        notes:" "
       }
    },
    {
      ord:"Milestone 4",
      nm:"Career Launch",
      when:"Senior year, fall or spring",
      credit:"Capstone assignment",
      planV:"v4.0",
      planName:"Career Launch Plan",
      fields:{
        credits:" ",
        sequencing:" ",
        courses:" ",
        criteria:" ",
        notes:" "
      }
    }
  ];

  var FIELD_ORDER=[
    ["credits","Credits"],
    ["sequencing","Sequencing"],
    ["courses","Possible Courses"],
    ["modality","Proposed Modality"],
    ["criteria","Criteria"],
    ["notes","Notes"],]

  /* ===================== nothing below needs editing ===================== */

  var prog=document.getElementById("prog"), detail=document.getElementById("detail");

  STAGES.forEach(function(s,i){
    var b=document.createElement("button");
    b.type="button"; b.className="stage"; b.dataset.i=i;
    b.innerHTML=
      '<span class="ms">'+
        '<span class="ord">'+s.ord+'</span>'+
        '<span class="nm">'+s.nm+'</span>'+
        '<span class="when">'+s.when+'</span>'+
        '<span class="credit">'+s.credit+'</span>'+
      '</span>'+
      '<span class="plan">'+
        '<span class="pv">'+s.planV+'</span>'+
        '<span class="pn">'+s.planName+'</span>'+
      '</span>';
    prog.appendChild(b);
  });

  function show(i){
    var s=STAGES[i];
    prog.querySelectorAll(".stage").forEach(function(e,j){ e.classList.toggle("on", j===i); });
    var h='<div class="dhead"><h2>'+s.ord+': '+s.nm+'</h2></div>'+
          '<div class="fields">';
    FIELD_ORDER.forEach(function(f){
      var txt=s.fields[f[0]]||"";
      var todo=/^Placeholder\./.test(txt);
      h+='<div class="field"><h3>'+f[1]+'</h3><div class="fb'+(todo?' todo':'')+'">'+txt+'</div></div>';
    });
    detail.innerHTML=h+'</div>';
  }

  prog.addEventListener("click", function(e){
    var b=e.target.closest(".stage");
    if(b) show(+b.dataset.i);
  });

  show(0);
})();
</script>
</body>
</html>

</body></html>

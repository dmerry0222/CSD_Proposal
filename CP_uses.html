<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What the Career Plan makes possible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#15284B;
    --navy-hover:rgba(21,40,75,.72);
    --gold:#E7AB2A;
    --blue:#3CB4E5;
    --teal:#3BBFAD;
    --rose:#CC3362;
    --body:#595959;
    --mute:#8A8A8A;
    --rule:rgba(21,40,75,.14);
    --hair:rgba(21,40,75,.08);
    --t02:rgba(21,40,75,.03);
    --t05:rgba(21,40,75,.05);
    --t08:rgba(21,40,75,.08);
    --sans:"Libre Franklin","Segoe UI",Helvetica,Arial,sans-serif;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;background:#fff;color:var(--body);
    font-family:var(--sans);font-size:1rem;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  /* ---------- blue header bar ---------- */
  .bar{
    background:var(--navy);color:#fff;
    padding:18px clamp(18px,4vw,44px) 0;
  }
  .bar h1{
    font-size:1.0625rem;font-weight:600;margin:0 0 2px;color:#fff;line-height:1.3;
  }
  .bar .sub{
    font-size:.8125rem;color:rgba(255,255,255,.62);margin:0 0 14px;
  }
  .tabs{display:flex;flex-wrap:wrap;gap:0;}
  .tabs button{
    background:none;border:0;border-bottom:3px solid transparent;
    color:rgba(255,255,255,.72);font:inherit;font-size:.8125rem;
    padding:10px 14px;cursor:pointer;text-align:left;line-height:1.3;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
  }
  .tabs button:hover{background:var(--navy-hover);color:#fff;}
  .tabs button.on{color:#fff;font-weight:600;border-bottom-color:var(--gold);background:rgba(255,255,255,.07);}
  .tabs button .n{
    display:block;font-size:.6875rem;letter-spacing:.08em;
    color:rgba(255,255,255,.45);margin-bottom:2px;
  }
  .tabs button.on .n{color:var(--gold);}

  /* ---------- explanatory paragraph ---------- */
  .lede{
    padding:22px clamp(18px,4vw,44px) 20px;
    border-bottom:1px solid var(--rule);
    background:#fff;
  }
  .lede h2{
    font-size:1.25rem;font-weight:600;color:#000;margin:0 0 8px;line-height:1.3;
    letter-spacing:-.01em;
  }
  .lede p{margin:0;max-width:74ch;font-size:1rem;line-height:1.6;}
  .lede .edit{
    font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--mute);margin:10px 0 0;
  }

  /* ---------- example stage ---------- */
  .stage{
    padding:24px clamp(14px,4vw,44px) 70px;
    background:#F2F4F6;
  }
  .screen{
    background:#fff;border:1px solid var(--rule);
    max-width:1080px;margin:0 auto;
    box-shadow:0 1px 10px rgba(21,40,75,.07);
  }
  .chrome{
    background:var(--t02);border-bottom:1px solid var(--rule);
    padding:9px 16px;display:flex;gap:10px;align-items:center;
    font-size:.75rem;color:var(--mute);
  }
  .chrome .dot{width:8px;height:8px;background:var(--teal);border-radius:50%;}
  .chrome b{color:var(--navy);font-weight:600;font-size:.8125rem;}
  .chrome .right{margin-left:auto;}
  .pad{padding:20px 22px;}

  h3.sh{
    font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--navy);margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule);
  }
  h3.sh.mt{margin-top:24px;}

  /* piped-content block */
  .piped{
    background:rgba(231,171,42,.1);border-left:3px solid var(--gold);
    padding:13px 15px;margin:0 0 14px;
  }
  .piped .src{
    font-size:.6875rem;letter-spacing:.07em;text-transform:uppercase;
    color:#8A6A1E;font-weight:600;display:block;margin-bottom:5px;
  }
  .piped .txt{font-size:.9375rem;line-height:1.5;color:var(--navy);margin:0;}
  .fieldkey{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.6875rem;color:var(--mute);background:var(--t05);
    padding:1px 5px;
  }

  /* form-ish */
  .q{font-size:.9375rem;color:#111;font-weight:500;margin:0 0 8px;line-height:1.45;}
  .input{
    border:1px solid var(--rule);border-left:3px solid var(--navy);
    background:#fff;padding:11px 13px;font-size:.9375rem;line-height:1.5;color:#1a1a1a;
  }
  .input.empty{
    border-left-color:var(--hair);color:var(--mute);font-style:italic;
    background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(21,40,75,.022) 6px,rgba(21,40,75,.022) 12px);
  }
  .inline-lb{font-size:.75rem;color:var(--mute);display:block;margin-bottom:4px;}
  .radios{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;}
  .radios span{
    border:1px solid var(--rule);padding:6px 11px;font-size:.8125rem;color:var(--body);
  }
  .radios span.sel{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:500;}

  /* email */
  .mail{border:1px solid var(--rule);}
  .mail .hdr{border-bottom:1px solid var(--rule);padding:12px 16px;font-size:.8125rem;}
  .mail .hdr div{margin-bottom:3px;}
  .mail .hdr .lb{color:var(--mute);display:inline-block;width:52px;}
  .mail .hdr .subj{font-size:.9375rem;font-weight:600;color:var(--navy);margin-top:6px;}
  .mail .body{padding:16px;font-size:.9375rem;line-height:1.6;}
  .mail .body p{margin:0 0 12px;}
  .goalrow{
    display:grid;grid-template-columns:22px 1fr;gap:9px;
    padding:9px 0;border-top:1px solid var(--hair);align-items:start;
  }
  .goalrow .bx{
    width:16px;height:16px;border:1.5px solid var(--navy);margin-top:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:.6875rem;color:#fff;font-weight:700;
  }
  .goalrow .bx.on{background:var(--navy);}
  .goalrow .meta{font-size:.75rem;color:var(--mute);margin-top:3px;}

  /* data check panel */
  .check{border:1px solid var(--rule);background:var(--t02);padding:14px 16px;}
  .ckrow{
    display:flex;gap:9px;align-items:baseline;padding:7px 0;
    border-top:1px solid var(--hair);font-size:.8125rem;
  }
  .ckrow:first-of-type{border-top:0;}
  .ckrow .ic{font-size:.6875rem;font-weight:700;padding:1px 6px;white-space:nowrap;}
  .ic.yes{background:rgba(59,191,173,.25);color:#17645A;}
  .ic.no{background:rgba(204,51,98,.14);color:#93244A;}
  .ic.part{background:var(--t08);color:var(--navy);}

  /* charts */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .kpi{border:1px solid var(--rule);border-top:3px solid var(--navy);padding:12px 14px;}
  .kpi b{display:block;font-size:1.75rem;font-weight:600;color:var(--navy);line-height:1;letter-spacing:-.02em;}
  .kpi span{display:block;font-size:.75rem;color:var(--mute);margin-top:5px;line-height:1.35;}
  .kpi em{font-style:normal;font-size:.6875rem;color:var(--teal);font-weight:600;}

  .brow{display:grid;grid-template-columns:1fr 54px;gap:10px;align-items:center;
    padding:5px 0;font-size:.8125rem;}
  .btrack{background:var(--t05);height:17px;position:relative;}
  .btrack i{display:block;height:17px;background:var(--navy);}
  .btrack i.alt{background:var(--blue);}
  .btrack i.warn{background:var(--rose);}
  .blab{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .bnum{text-align:right;font-size:.8125rem;color:var(--navy);font-weight:600;}

  .lk{display:grid;grid-template-columns:1fr 120px 60px;gap:10px;align-items:center;
    padding:6px 0;border-top:1px solid var(--hair);font-size:.8125rem;}
  .lkbar{display:flex;gap:2px;}
  .lkbar i{flex:1;height:12px;background:var(--t08);}
  .lkbar i.f{background:var(--navy);}
  .lkbar i.g{background:var(--gold);}
  .up{color:#2E7D63;font-weight:600;}

  /* tables */
  table.t{width:100%;border-collapse:collapse;font-size:.8125rem;}
  table.t th{
    text-align:left;font-size:.6875rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--navy);background:var(--t02);padding:8px 10px;border-bottom:1px solid var(--rule);
    position:sticky;top:0;
  }
  table.t td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.45;}
  table.t tr:last-child td{border-bottom:0;}
  .flagpill{
    display:inline-block;font-size:.6875rem;font-weight:600;padding:2px 7px;margin:1px 3px 1px 0;
  }
  .f-high{background:rgba(204,51,98,.14);color:#93244A;}
  .f-med{background:rgba(231,171,42,.26);color:#7A5A12;}
  .f-low{background:var(--t08);color:var(--navy);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .chip{
    border:1px solid var(--rule);padding:5px 11px;font-size:.75rem;color:var(--body);
  }
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:500;}
  .btn{
    background:var(--navy);color:#fff;border:0;font:inherit;font-size:.75rem;
    padding:5px 10px;cursor:default;
  }

  /* roster */
  .rost{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stu{border:1px solid var(--rule);padding:12px 14px;break-inside:avoid;}
  .stu .top{display:flex;gap:10px;align-items:baseline;margin-bottom:3px;}
  .stu .nm{font-size:.9375rem;font-weight:600;color:var(--navy);}
  .stu .sid{font-size:.6875rem;color:var(--mute);margin-left:auto;font-family:ui-monospace,Menlo,monospace;}
  .stu .mj{font-size:.75rem;color:var(--mute);margin:0 0 8px;}
  .stu .gl{font-size:.875rem;line-height:1.5;color:#1a1a1a;margin:0;
    padding-left:10px;border-left:2px solid var(--gold);}
  .stu .wc{font-size:.6875rem;color:var(--mute);margin:6px 0 0;}

  .foot{
    max-width:1080px;margin:14px auto 0;font-size:.75rem;color:var(--mute);
  }

  @media (max-width:860px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .rost{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr !important;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important;} }
</style>
</head>
<body>

<div class="bar">
  <h1>Career Strategy &amp; Design — what the Career Plan makes possible</h1>
  <p class="sub">Five things you can do with structured responses that you cannot do with an essay in Canvas</p>
  <div class="tabs" id="tabs"></div>
</div>

<div class="lede" id="lede"></div>
<div class="stage"><div id="stage"></div>
  <p class="foot">Illustrative sample data. Student names, identifiers and responses are fabricated for demonstration.</p>
</div>

<script>
(function(){
  "use strict";

  var USES=[
  {
    n:"Use 01",
    tab:"Piping forward<br>into the next plan",
    h:"The plan asks students to revise, not to start over",
    p:"Because every response is stored as a field rather than as prose in a submitted document, the next version of the Career Plan can open with what the student actually said last time. The student is not asked \"what is your career aspiration?\" a second time — they are shown their own words from eighteen months ago and asked what has changed. This is the difference between four assignments and one longitudinal instrument. It also makes the reflection honest: a student cannot quietly rewrite their history to match where they ended up, because the prior response is on the screen in front of them. For the program, the paired responses are the assessment evidence — we can see movement, direction and reasoning, not just a final state."
  },
  {
    n:"Use 02",
    tab:"Piping into<br>follow-up outreach",
    h:"Follow-up that references what the student committed to",
    p:"The goals a student sets are stored as discrete records with an action, a detail and a deadline, so an email in March can name the three things they said in December. The outreach writes itself, and it arrives specific rather than generic — which is the difference between a message students ignore and one they answer. Because the system also holds attendance and appointment records, self-reported progress can be set beside what we already know: a student who says they have not yet met with an advisor, when our records show they came in twice, is telling us something about how they understand their own progress. Note that this is the point where governance matters most; who may send what, and on what basis, should be settled before the first message goes out."
  },
  {
    n:"Use 03",
    tab:"Program-level<br>pattern and outcome",
    h:"Aggregate views of aspiration, obstacle and competency",
    p:"When pathway selections are drawn from a fixed taxonomy rather than typed freely, they count. We can say how many students are heading toward a given Career Community, which obstacles they report most often, and where self-efficacy moves between versions of the plan — by major, by school, by first-generation status, by any population we are accountable for. This is the view that answers a dean's question about whether the requirement is working, and it is the view that is impossible to produce from a folder of essays. The competency movement is especially useful in accreditation conversations, because it is a repeated measure on the same students rather than a satisfaction survey."
  },
  {
    n:"Use 04",
    tab:"Advisor worklist<br>and triage",
    h:"Finding the students who need a conversation",
    p:"The same fields that aggregate also flag. A student with no pathway selected in their second year, a senior with no work-based learning plan, a self-efficacy score of 1 on asking for an informational conversation, a reported financial obstacle — each is a condition we can query rather than a problem we discover late, or never. Advisors begin the week with a list ordered by urgency instead of waiting for the students who were already going to come in. This is the equity mechanism in operation: the students who do not self-select into the career center are precisely the students this list surfaces."
  },
  {
    n:"Use 05",
    tab:"Shared back to<br>faculty and advisors",
    h:"Giving instructors something genuinely useful before class",
    p:"A short, structured field — a career goal statement of 50 to 75 words — can be assembled into a roster and handed to the person who is about to teach or advise those students. An instructor can see, before Tuesday's class, what each of their students is working toward, in the student's own words. An advisor can read fourteen statements in four minutes before a day of appointments. This is the lowest-effort, highest-goodwill use of the data, and it is often the one that convinces faculty the requirement is for them too, rather than something done to their curriculum."
  }];

  /* ===================== SCREEN 1 ===================== */
  function screen1(){
    return '<div class="screen"><div class="chrome"><span class="dot"></span>'+
      '<b>Career Plan v2.0 — Career Navigation</b><span>Section A · Direction</span>'+
      '<span class="right">Maya Ellison · S0148827 · autosaved 2:14 PM</span></div>'+
      '<div class="pad">'+
      '<h3 class="sh">Question A1 — Career aspiration</h3>'+
      '<div class="piped"><span class="src">Piped from Career Plan v1.0 · submitted March 14, 2027 · field <span class="fieldkey">cp1_a1_aspiration</span></span>'+
      '<p class="txt">"I think I want to work in health somehow, but not as a clinician. Maybe public health? I like the idea of working on problems that affect a lot of people at once rather than one person at a time. I don\'t really know what the jobs are called yet."</p></div>'+
      '<p class="q">That is what you wrote at the end of your first year. What is your career aspiration now?</p>'+
      '<div class="input"><span class="inline-lb">Field <span class="fieldkey">cp2_a1_aspiration</span> · 68 words</span>'+
      'I want to work in hospital operations — specifically quality improvement, where you find what is broken in a process and prove it with data. I know the job titles now: performance improvement analyst, quality improvement coordinator, revenue cycle analyst. Public health is still interesting to me but it needs an MPH, and I am not ready to commit to that until I have worked for a few years.</div>'+

      '<p class="q" style="margin-top:20px">How has it changed, or not changed — and what caused that?</p>'+
      '<div class="input"><span class="inline-lb">Field <span class="fieldkey">cp2_a2_change_reason</span> · 61 words</span>'+
      'The direction is the same, the vagueness is gone. Two things caused it: filtering the pathways site by my major showed me that "the business side of care" is an actual career with actual titles, and talking to Devon Marsh for forty minutes showed me what the week looks like. I did not change my mind. I found out what my mind was pointing at.</div>'+

      '<div class="radios"><span class="inline-lb" style="width:100%;margin:0 0 2px">Which best describes the change? <span class="fieldkey">cp2_a3_change_type</span></span>'+
      '<span>No meaningful change</span><span class="sel">Same direction, more specific</span>'+
      '<span>Shifted to an adjacent pathway</span><span>Changed substantially</span><span>Still undecided</span></div>'+

      '<h3 class="sh mt">Question A4 — Pathway selections</h3>'+
      '<div class="piped"><span class="src">Piped from v1.0 · field <span class="fieldkey">cp1_a4_pathway_ids[]</span></span>'+
      '<p class="txt">Healthcare Administration &amp; Health Data · Public Health &amp; Epidemiology · Policy Analysis &amp; Social Research</p></div>'+
      '<p class="q">Keep, drop or add. You must give a reason for anything you drop.</p>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px" class="grid2">'+
      '<div class="input"><span class="inline-lb">Healthcare Administration &amp; Health Data</span><b style="color:var(--navy)">Kept — now primary</b></div>'+
      '<div class="input"><span class="inline-lb">Public Health &amp; Epidemiology</span><b style="color:var(--navy)">Kept — secondary</b></div>'+
      '<div class="input"><span class="inline-lb">Policy Analysis &amp; Social Research</span><b style="color:#93244A">Dropped</b> — the RA job showed me I don\'t enjoy a full day of literature review.</div>'+
      '</div></div></div>';
  }

  /* ===================== SCREEN 2 ===================== */
  function screen2(){
    return '<div class="screen"><div class="chrome"><span class="dot"></span><b>Outreach — generated from Career Plan goal records</b>'+
      '<span class="right">Batch: 418 recipients · merge fields resolved</span></div>'+
      '<div class="pad"><div style="display:grid;grid-template-columns:1.35fr 1fr;gap:20px" class="grid2">'+

      '<div class="mail"><div class="hdr">'+
      '<div><span class="lb">From</span> Center for Career Equity, Development &amp; Success</div>'+
      '<div><span class="lb">To</span> mellison@su.suffolk.edu</div>'+
      '<div><span class="lb">Sent</span> March 3, 2029</div>'+
      '<div class="subj">Maya — how did those three goals go?</div></div>'+
      '<div class="body"><p>Hi Maya,</p>'+
      '<p>Back in December you set three career actions for yourself. Here they are again. Could you tell us where each one stands?</p>'+
      '<div class="goalrow"><span class="bx on">✓</span><div><b>Secure work-based learning placement</b>'+
      '<div class="meta">Deadline you set: 03/01/2029 · <span class="fieldkey">goal_id 7741</span></div></div></div>'+
      '<div class="goalrow"><span class="bx"></span><div><b>Complete a skills inventory against your two remaining pathways</b>'+
      '<div class="meta">Deadline you set: 04/20/2029 · <span class="fieldkey">goal_id 7742</span></div></div></div>'+
      '<div class="goalrow"><span class="bx"></span><div><b>Mock interview with an advisor before your summer start</b>'+
      '<div class="meta">Deadline you set: 05/15/2029 · <span class="fieldkey">goal_id 7743</span></div></div></div>'+
      '<p style="margin-top:14px">It takes about ninety seconds. Whatever you say here goes straight into Career Plan v2.0, so you will not have to write it twice.</p>'+
      '<p style="margin-bottom:0">— Rachel Alvarez, your advisor in Healthcare &amp; Wellness</p></div></div>'+

      '<div><h3 class="sh">Self-report set beside what we already know</h3>'+
      '<div class="check">'+
      '<div class="ckrow"><span class="ic yes">Confirmed</span><div><b>Placement secured.</b> Student reports complete; WBL record created 02/26/2029, employer verified.</div></div>'+
      '<div class="ckrow"><span class="ic no">Gap</span><div><b>Skills inventory not started.</b> No submission on file. Deadline is in seven weeks.</div></div>'+
      '<div class="ckrow"><span class="ic part">Discrepancy</span><div><b>Student reports no advising contact since the fall.</b> Our records show two appointments, 01/23 and 03/12. Worth a gentle correction — or worth asking what did not feel like advising.</div></div>'+
      '</div>'+
      '<h3 class="sh mt">What this replaces</h3>'+
      '<p style="font-size:.875rem;margin:0">A generic end-of-term email asking students to "reflect on your progress," which produces a 6% response rate and nothing comparable across students.</p>'+
      '<h3 class="sh mt">Governance note</h3>'+
      '<p style="font-size:.875rem;margin:0">Merge fields here are limited to the student\'s own prior responses. Any use beyond that — sharing with instructors, flagging to advisors — is a separate permission, set per field.</p>'+
      '</div></div></div></div>';
  }

  /* ===================== SCREEN 3 ===================== */
  function bars(rows,cls){
    var mx=Math.max.apply(null,rows.map(function(r){return r[1];}));
    return rows.map(function(r){
      return '<div class="brow"><div><div class="blab"><span>'+r[0]+'</span></div>'+
        '<div class="btrack"><i class="'+(cls||"")+'" style="width:'+(r[1]/mx*100).toFixed(1)+'%"></i></div></div>'+
        '<div class="bnum">'+r[1]+'</div></div>';
    }).join("");
  }
  function screen3(){
    var paths=[["Healthcare Administration & Health Data",71],["Marketing Strategy & Brand Management",64],
      ["Software Engineering",58],["Public Accounting",52],["Public Health & Epidemiology",47],
      ["Criminal Justice & Public Safety",41],["Data Science & Analytics",39],["Social Work & Human Services",34]];
    var obst=[["Paying for college expenses",287],["Not knowing what jobs exist for my major",241],
      ["No professional network to draw on",223],["Managing anxiety about the search",198],
      ["Finding time around work and commuting",176],["Nobody in my family has done this",149]];
    var comp=[["Describe what I'm interested in, out loud",3.9,3.1],["Find pathways connected to my major",4.4,3.6],
      ["Read earnings and outlook data",3.4,2.7],["Ask for an informational conversation",3.2,2.2],
      ["Name specific skills and where I got them",3.6,2.9],["Explain what work-based learning is",4.5,3.3]];
    var h='<div class="screen"><div class="chrome"><span class="dot"></span><b>Program dashboard — Career Plan v2.0</b>'+

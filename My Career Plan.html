<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Career Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#15284B;
    --navy-2:#1D3560;
    --gold:#E7AB2A;
    --blue:#3CB4E5;
    --teal:#3BBFAD;
    --green:#2E7D63;
    --rose:#B04A5F;
    --ink:#1A1A1A;
    --body:#4F5663;
    --mute:#7B8494;
    --line:#E2E6EC;
    --line-2:#EDF0F4;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --tint:#F7F9FC;
    --sans:"Libre Franklin","Segoe UI",Helvetica,Arial,sans-serif;
    --r:10px;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--body);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  button{font:inherit;}

  /* ================= app bar ================= */
  .appbar{
    position:sticky;top:0;z-index:40;background:var(--navy);
    padding-top:env(safe-area-inset-top,0px);
  }
  .appbar .row1{
    display:flex;align-items:center;gap:14px;
    padding:14px clamp(16px,4vw,36px) 10px;
    max-width:1100px;margin:0 auto;
  }
  .appbar .mark{width:24px;height:3px;background:var(--gold);}
  .appbar h1{
    font-size:15px;font-weight:600;color:#fff;margin:0;letter-spacing:.01em;
  }
  .saved{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    font-size:12.5px;color:rgba(255,255,255,.65);
  }
  .saved .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .tabs{
    display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);gap:2px;max-width:1100px;margin:0 auto;
    padding:0 clamp(16px,4vw,36px);overflow-x:auto;
  }
  .tabs button{
    background:none;border:0;border-bottom:3px solid transparent;
    color:rgba(255,255,255,.7);font-size:13.5px;
    padding:9px 14px 10px;cursor:pointer;white-space:nowrap;
    display:flex;flex-direction:column;gap:1px;text-align:left;
    transition:color .18s ease,background .18s ease,border-color .18s ease;
  }
  .tabs button .tv{font-weight:600;font-size:14.5px;}
  .tabs button .tn{font-size:11.5px;color:rgba(255,255,255,.5);}
  .tabs button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .tabs button.on{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.07);}
  .tabs button.on .tn{color:var(--gold);}
  .tabs button .td{font-size:11px;color:#7FD6C2;margin-top:1px;}
  .tabs button:disabled{cursor:not-allowed;opacity:.38;}
  .tabs button:disabled:hover{background:none;color:rgba(255,255,255,.7);}

  /* ================= page ================= */
  .wrap{max-width:1100px;margin:0 auto;padding:22px clamp(16px,4vw,36px) 90px;}

  /* hero */
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:22px 24px;margin-bottom:18px;
    display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start;
  }
  .avatar{
    width:62px;height:62px;border-radius:50%;background:var(--navy);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:600;letter-spacing:.02em;
  }
  .hero .who h2{font-size:21px;font-weight:600;color:var(--ink);margin:0;line-height:1.2;}
  .hero .who .maj{font-size:13.5px;color:var(--mute);margin:3px 0 0;}
  .goalbox{
    margin:13px 0 0;padding:13px 15px;background:var(--tint);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;
    position:relative;
  }
  .goalbox .lb{
    font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--mute);display:block;margin-bottom:5px;
  }
  .goalbox p{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink);}
  .goalbox .prev{
    display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:12.5px;color:var(--mute);
  }
  .ring{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .ring .pct{font-size:19px;font-weight:600;color:var(--navy);line-height:1;}
  .ring .pl{font-size:11.5px;color:var(--mute);}
  .ringbar{width:86px;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;}
  .ringbar i{display:block;height:6px;background:var(--gold);}

  /* section */
  .sec{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 24px 22px;margin-bottom:16px;
  }
  .sechead{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:1px solid var(--line-2);margin-bottom:16px;
  }
  .sechead h3{font-size:17px;font-weight:600;color:var(--ink);margin:0;line-height:1.3;}
  .sechead .hint{font-size:13px;color:var(--mute);}
  .sechead .act{margin-left:auto;display:flex;gap:8px;}

  /* controls */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:7px;
    color:var(--navy);font-size:13px;padding:5px 11px;cursor:pointer;
    transition:background .16s ease,border-color .16s ease;
  }
  .btn:hover{background:var(--tint);border-color:#C9D0DA;}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  .btn.primary:hover{background:#0F1E39;}
  .ic{width:13px;height:13px;display:block;flex:none;}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:999px;background:#fff;
    font-size:12.5px;font-weight:500;padding:3px 9px 3px 11px;cursor:pointer;
    color:var(--body);white-space:nowrap;
    transition:border-color .16s ease,background .16s ease;
  }
  .chip:hover{border-color:#B9C2CF;background:var(--tint);}
  .chip .cdot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none;}
  .chip .car{width:9px;height:9px;opacity:.5;flex:none;}
  .chip.done{background:rgba(46,125,99,.09);border-color:rgba(46,125,99,.3);color:#1F5A47;}
  .chip.done .cdot{background:var(--green);}
  .chip.track{background:rgba(60,180,229,.1);border-color:rgba(60,180,229,.35);color:#19617E;}
  .chip.track .cdot{background:var(--blue);}
  .chip.soon{background:rgba(231,171,42,.14);border-color:rgba(231,171,42,.45);color:#7A5A12;}
  .chip.soon .cdot{background:var(--gold);}
  .chip.not{background:#fff;}

  /* editable field look */
  .field{
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-size:14.5px;line-height:1.55;color:var(--ink);
    position:relative;
  }
  .field.live{
    border-color:var(--navy);box-shadow:0 0 0 3px rgba(21,40,75,.08);
  }
  .field .caret{
    display:inline-block;width:1.5px;height:17px;background:var(--navy);
    vertical-align:-3px;margin-left:1px;animation:blink 1.1s step-end infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .field.empty{
    border-style:dashed;color:var(--mute);background:var(--tint);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .fieldlb{
    font-size:12.5px;color:var(--mute);display:block;margin-bottom:6px;
  }
  .wc{font-size:12px;color:var(--mute);margin:5px 0 0;display:flex;gap:10px;}
  .wc .sv{color:var(--green);}

  /* confidence bars */
  .cf{
    display:grid;grid-template-columns:1fr 132px 74px;gap:14px;align-items:center;
    padding:9px 0;border-top:1px solid var(--line-2);
  }
  .cf:first-of-type{border-top:0;}
  .cf .q{font-size:14px;line-height:1.4;color:var(--ink);}
  .cfbar{display:flex;gap:3px;}
  .cfbar i{flex:1;height:14px;border-radius:2px;background:var(--line-2);}
  .cfbar i.f{background:var(--navy);}
  .cfbar i.g{background:var(--gold);}
  .cfv{font-size:12.5px;color:var(--mute);text-align:right;white-space:nowrap;}
  .cfv b{color:var(--navy);font-size:14px;}
  .up{color:var(--green);font-weight:600;}
  .scale{
    display:flex;justify-content:space-between;font-size:12px;color:var(--mute);
    margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2);
  }

  /* pathway cards */
  .pws{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .pw{
    border:1px solid var(--line);border-radius:9px;padding:15px 16px;
    border-top:3px solid var(--navy);position:relative;
  }
  .pw.added{border-top-color:var(--gold);}
  .pw.dropped{border-top-color:#D7C3C3;background:var(--tint);}
  .pw .rank{
    font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--mute);display:block;margin-bottom:4px;
  }
  .pw h4{font-size:15.5px;font-weight:600;color:var(--navy);margin:0 0 2px;line-height:1.25;}
  .pw .cc{font-size:12.5px;color:var(--mute);margin:0 0 11px;}
  .pw .nums{
    display:flex;gap:14px;align-items:flex-end;
    padding:10px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
    margin-bottom:11px;
  }
  .pw .nums .n{font-size:19px;font-weight:600;color:var(--navy);line-height:1;}
  .pw .nums .nl{font-size:11.5px;color:var(--mute);display:block;margin-top:3px;}
  .pw .refl{font-size:13.5px;line-height:1.5;color:var(--body);margin:0;}
  .pw .prev{
    display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:12.5px;color:var(--mute);
  }

  /* goals list */
  .goal{
    display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
    padding:12px 0;border-top:1px solid var(--line-2);
  }
  .goal:first-of-type{border-top:0;}
  .goal .gt{font-size:14.5px;color:var(--ink);font-weight:500;}
  .goal .gd{font-size:13px;color:var(--mute);margin-top:2px;}
  .goal .right{display:flex;align-items:center;gap:10px;}
  .due{
    font-size:13px;color:var(--body);background:var(--tint);
    border:1px solid var(--line);border-radius:7px;padding:4px 9px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  }
  .due:hover{border-color:#B9C2CF;}

  /* simple rows */
  .rows{display:flex;flex-direction:column;}
  .row{
    display:grid;gap:12px;align-items:start;
    padding:12px 0;border-top:1px solid var(--line-2);
  }
  .row:first-child{border-top:0;}
  .row .dt{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;}
  .row .w{font-size:14px;color:var(--ink);}
  .row .t{font-size:13px;color:var(--mute);}
  .r-appt{grid-template-columns:86px 1fr;}
  .r-net{grid-template-columns:1.1fr 1.2fr 1.4fr auto;}
  .r-tl{grid-template-columns:96px 1fr;}

  .tag{
    display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:2px 7px;border-radius:5px;vertical-align:1px;margin-right:6px;
  }
  .tag.new{background:rgba(231,171,42,.2);color:#7A5A12;}
  .tag.upd{background:rgba(60,180,229,.14);color:#19617E;}

  /* quote / reflection */
  .reflect{
    background:var(--tint);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:8px;padding:16px 18px;
  }
  .reflect .prompt{
    font-size:14px;font-weight:600;color:var(--navy);margin:0 0 9px;line-height:1.45;
  }
  .reflect p{margin:0 0 11px;font-size:14.5px;line-height:1.6;color:var(--ink);}
  .reflect p:last-child{margin-bottom:0;}

  /* funnel */
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .fn{
    border:1px solid var(--line);border-radius:9px;padding:13px;text-align:center;
  }
  .fn.win{background:var(--navy);border-color:var(--navy);}
  .fn b{display:block;font-size:26px;font-weight:600;color:var(--navy);line-height:1;}
  .fn.win b{color:var(--gold);}
  .fn span{display:block;font-size:11.5px;color:var(--mute);margin-top:5px;}
  .fn.win span{color:rgba(255,255,255,.75);}

  /* applications */
  .app{
    border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:11px;
  }
  .app .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px;}
  .app .co{font-size:15px;font-weight:600;color:var(--navy);}
  .app .ro{font-size:14px;color:var(--ink);}
  .app .meta{font-size:12.5px;color:var(--mute);margin-left:auto;}
  .app .next{
    font-size:13.5px;color:var(--body);margin:9px 0 0;padding-top:9px;
    border-top:1px solid var(--line-2);
  }
  .app .qs{margin:8px 0 0;padding:0;list-style:none;}
  .app .qs li{
    font-size:13.5px;color:var(--body);line-height:1.45;
    padding:3px 0 3px 12px;border-left:2px solid var(--gold);margin-bottom:4px;
  }

  /* jobs */
  .job{border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:11px;}
  .job .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .job .jt{font-size:15px;font-weight:600;color:var(--navy);}
  .job .jo{font-size:14px;color:var(--ink);}
  .job .lnk{font-size:12.5px;color:var(--blue);margin:3px 0 8px;word-break:break-all;}
  .job .why{font-size:13.5px;line-height:1.5;color:var(--body);margin:0 0 9px;}
  .kw{
    display:inline-block;font-size:12px;background:var(--tint);color:var(--body);
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:3px 5px 0 0;
  }
  .kw.hit{background:rgba(231,171,42,.17);border-color:rgba(231,171,42,.4);color:#7A5A12;font-weight:500;}

  /* links */
  .doclink{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:8px;padding:11px 13px;
    font-size:13.5px;color:var(--navy);background:#fff;margin-bottom:9px;
  }
  .doclink .ic{color:var(--mute);}

  .addrow{
    display:flex;align-items:center;gap:8px;margin-top:13px;
    padding-top:13px;border-top:1px dashed var(--line);
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  @media (max-width:760px){
    .hero{grid-template-columns:auto 1fr;}
    .ring{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px;}
    .cf{grid-template-columns:1fr;gap:7px;}
    .cfv{text-align:left;}
    .r-net{grid-template-columns:1fr;}
    .funnel{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
    .goal{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;}
    .field .caret{animation:none;}
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="row1">
    <span class="mark"></span>
    <h1>My Career Plan</h1>
    <span class="saved"><span class="dot"></span><span id="savedtxt">Saved just now</span></span>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap" id="wrap"></div>

<script>
(function(){
  "use strict";

  /* --- small inline icons --- */
  var I={
    pencil:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2L6 12l-3 1 1-3z"/></svg>',
    caret:'<svg class="car" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5 9 4.5"/></svg>',
    plus:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
    cal:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>',
    doc:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>',
    link:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 9a3 3 0 004.2 0l2-2A3 3 0 009 2.8L7.8 4"/><path d="M9 7a3 3 0 00-4.2 0l-2 2A3 3 0 007 13.2L8.2 12"/></svg>'
  };

  function chip(state,label){
    return '<button class="chip '+state+'"><span class="cdot"></span>'+label+I.caret+'</button>';
  }
  function editBtn(){ return '<button class="btn">'+I.pencil+'Edit</button>'; }
  function addBtn(t){ return '<button class="btn">'+I.plus+t+'</button>'; }

  function bars(v,prev){
    var h='<span class="cfbar">';
    for(var i=1;i<=5;i++){
      var c = i<=v ? (prev!=null && i>prev ? 'f g' : 'f') : '';
      h+='<i class="'+c+'"></i>';
    }
    return h+'</span>';
  }
  function cfRow(q,v,prev){
    var d='';
    if(prev!=null && v>prev) d='<span class="up">+'+(v-prev)+'</span>';
    else if(prev!=null) d='<span style="color:#B9C0CB">—</span>';
    return '<div class="cf"><span class="q">'+q+'</span>'+bars(v,prev)+
           '<span class="cfv"><b>'+v+'</b>/5 '+d+'</span></div>';
  }
  function scale(){
    return '<div class="scale"><span>1 — Not at all confident</span><span>5 — Completely confident</span></div>';
  }
  function sec(title,hint,actions,inner){
    return '<div class="sec"><div class="sechead"><h3>'+title+'</h3>'+
      (hint?'<span class="hint">'+hint+'</span>':'')+
      (actions?'<span class="act">'+actions+'</span>':'')+
      '</div>'+inner+'</div>';
  }

  /* ===================================================================== */

  var V=[];

  /* ---------------------------- v1.0 ---------------------------- */
  V.push({
    v:"v1.0", name:"Career Exploration Plan", term:"First year, spring",
    build:function(){
      var h='';
      h+='<div class="hero">'+
        '<div class="avatar">ME</div>'+
        '<div class="who"><h2>Maya Ellison</h2>'+
        '<p class="maj">B.A. Sociology · Minor, Public Health · Class of 2030</p>'+
        '<div class="goalbox"><span class="lb">Where I\'m headed right now</span>'+
        '<p>First-year Sociology student interested in how health systems are organized — exploring whether that means working inside a hospital, in public health, or in research.<span class="caret"></span></p>'+
        '<p class="wc"><span>41 words</span><span class="sv">Saving…</span></p></div></div>'+
        '<div class="ring"><div class="ringbar"><i style="width:72%"></i></div>'+
        '<span class="pct">72%</span><span class="pl">complete</span></div>'+
      '</div>';

      h+=sec("How confident do you feel?","Answer honestly — this is a starting point, not a test",editBtn(),
        cfRow("Describing what I'm interested in, out loud, to someone I don't know",2)+
        cfRow("Finding career pathways connected to my major",4)+
        cfRow("Reading earnings and employment data and saying what it means for me",2)+
        cfRow("Asking someone for an informational conversation",1)+
        cfRow("Naming specific skills I have and where I got them",2)+
        cfRow("Explaining what work-based learning is and when mine has to happen",3)+
        scale());

      h+=sec("Pathways you're exploring","Pick three to follow for now",addBtn("Add a pathway"),
        '<div class="pws">'+
        pw("Healthcare Administration &amp; Health Data","Healthcare &amp; Wellness","$74,900","median, MA","+28%","2024–34",

        app("Tufts Medicine","Operations Analyst","Applied Jan 15","not","Not moving forward",
          "Closed. Asked for feedback — they cited SQL depth.",[]));

      h+=sec("How confident do you feel?","Gold shows where you've grown since the fall",editBtn(),
        cfRow("Describing what I'm interested in, out loud, to someone I don't know",5,5)+
        cfRow("Naming specific skills I have and where I got them",5,5)+
        cfRow("Answering a behavioral interview question without rehearsing first",5,4)+
        cfRow("Asking a question about pay or conditions before accepting an offer",4,3)+
        cfRow("Claiming a technical tool on my resume and defending it in an interview",4,2)+
        cfRow("Keeping on applying after a rejection without stalling for a week",4,2)+
        scale());

      h+=sec("People you know","Six contacts — three have helped directly this year",addBtn("Add a person"),
        '<div class="rows">'+
        net("Karen Whitlock","Director, Performance Improvement","Beth Israel Lahey Health","Reference provided; quarterly update either way","Feb 27")+
        net("Priya Raghunathan","Senior Analyst, Quality","Beth Israel Lahey Health","Monthly; reviewed two of my SQL practice sets","Mar 6",'upd')+
        net("Devon Marsh","Operations Analyst","Beth Israel Lahey Health","Coffee each semester","Jan 19")+
        net("Amara Boateng","Senior Program Manager","Boston Public Health Commission","Offered to flag my Codman application","Mar 11",'upd')+
        net("Tomas Reyes","Epic Reporting Analyst","Mass General Brigham","Twice a year; referred me internally at MGB","Dec 2",'upd')+
        net("Rachel Alvarez","Career Advisor, Healthcare &amp; Wellness","Suffolk CCEDS","Final appointment booked before graduation","Mar 2")+
        '</div>');

      h+=sec("Your interview answers","Two rewritten around your internship","",
        iv("Tell me about a time you had to work with someone whose approach was different from yours.",
           "During my internship I built a report showing discharge delays concentrated on one unit on weekends. I presented it to the nurse manager and she told me she already knew, and that the cause was a staffing rule I hadn't known about. Rather than defend the analysis I asked her to walk me through the rule, and we rebuilt the measure to separate delays she controlled from delays she didn't. The second version got used. What I'd do differently is ask first — I'd have found the rule in a ten-minute conversation before spending two weeks on the wrong cut of the data.",
           "At my campus job in the Dean's office, a colleague wanted to keep the room-booking log on paper…")+
        iv("What are some of your strengths?",
           "My supervisor put it better than I had: I'm strongest when the data has a person attached to it. Concretely, I'm good at taking an operational question, finding the measure that actually answers it, and explaining it to the people who have to act on it. The weakness I'd name is that I waited to be assigned work rather than asking for the problem — that was in my evaluation and it's the specific thing I want to do differently from week one.",
           "I'm good at finding the step in a process that's quietly costing everyone time…")+
        iv("What did you learn in <b>SOC 450: Senior Thesis Seminar</b> that could help you in this role?",
           "My thesis used the discharge data from my internship, de-identified and with permission. Writing it taught me to state what the data cannot show as clearly as what it can — I have a limitations section I actually believe in, which is more than I could say about the week-seven version of the analysis.")+
        iv("What did you learn in <b>STAT 240: Statistics for the Social Sciences</b> that could help you in this role?",null));

      h+=sec("Your goals","",addBtn("Add a goal"),
        goal("Respond to an offer","BILH Performance Improvement Analyst","Mar 28, 2030","soon","Due soon")+
        goal("Prepare for an interview","MGB final round — revenue cycle vocabulary review","Mar 23, 2030","soon","Due soon")+
        goal("Follow up on an application","Four follow-ups scheduled this week","Mar 22, 2030","track","On track")+
        goal("Thank a network contact","Karen, Priya and Tomas once the decision is made","Apr 5, 2030","not","Not started"));

      return h;
    }
  });

  /* ---------------------- component builders ---------------------- */
  function pw(name,cc,earn,earnL,tr,trL,refl,rank,prev){
    return '<div class="pw">'+(rank?'<span class="rank">'+rank+'</span>':'')+
      '<h4>'+name+'</h4><p class="cc">'+cc+'</p>'+
      '<div class="nums"><div><span class="n">'+earn+'</span><span class="nl">'+earnL+'</span></div>'+
      '<div style="margin-left:auto;text-align:right"><span class="n">'+tr+'</span><span class="nl">'+trL+'</span></div></div>'+
      '<p class="refl">'+refl+'</p>'+
      (prev?'<span class="prev">You wrote before: <i>'+prev+'</i></span>':'')+'</div>';
  }
  function pwAdded(name,cc,earn,earnL,tr,trL,refl){
    return '<div class="pw added"><span class="rank" style="color:#7A5A12">Added this year</span>'+
      '<h4>'+name+'</h4><p class="cc">'+cc+'</p>'+
      '<div class="nums"><div><span class="n">'+earn+'</span><span class="nl">'+earnL+'</span></div>'+
      '<div style="margin-left:auto;text-align:right"><span class="n">'+tr+'</span><span class="nl">'+trL+'</span></div></div>'+
      '<p class="refl">'+refl+'</p></div>';
  }
  function pwDropped(name,refl){
    return '<div class="pw dropped"><span class="rank" style="color:#8E5A5A">No longer exploring</span>'+
      '<h4 style="color:#6E7684">'+name+'</h4>'+
      '<p class="refl" style="margin-top:9px">'+refl+'</p></div>';
  }
  function goal(t,d,due,st,stl){
    return '<div class="goal"><div><div class="gt">'+t+'</div><div class="gd">'+d+'</div></div>'+
      '<div class="right"><span class="due">'+I.cal+due+'</span>'+chip(st,stl)+'</div></div>';
  }
  function wgoal(g,how){
    return '<div class="field" style="margin-bottom:11px"><b style="color:var(--navy)">'+g+'</b>'+
      '<div style="font-size:13.5px;color:var(--body);margin-top:6px">'+how+'</div></div>';
  }
  function appt(d,w,t){
    return '<div class="row r-appt"><span class="dt">'+d+'</span>'+
      '<div><div class="w">'+w+'</div><div class="t">'+t+'</div></div></div>';
  }
  function net(n,r,o,c,l,tag){
    return '<div class="row r-net">'+
      '<div><div class="w">'+(tag?'<span class="tag '+tag+'">'+(tag==='new'?'New':'Updated')+'</span>':'')+n+'</div></div>'+
      '<div><div class="t">'+r+'</div><div class="t" style="color:#9AA3B1">'+o+'</div></div>'+
      '<div class="t">'+c+'</div>'+
      '<div class="t" style="white-space:nowrap">'+l+'</div></div>';
  }
  function tl(d,k,t){
    return '<div class="row r-tl"><span class="dt">'+d+'</span>'+
      '<div><span class="kw">'+k+'</span> <span class="w">'+t+'</span></div></div>';
  }
  function iv(q,a,prev){
    if(!a){
      return '<div style="margin-bottom:13px"><span class="fieldlb">'+q+'</span>'+
        '<div class="field empty"><span>You haven\'t answered this one yet</span>'+
        '<button class="btn primary">'+I.plus+'Write an answer</button></div></div>';
    }
    return '<div style="margin-bottom:13px"><span class="fieldlb">'+q+'</span>'+
      '<div class="field">'+a+
      (prev?'<span class="prev" style="display:block;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute)">Earlier answer: <i>'+prev+'</i></span>':'')+
      '</div></div>';
  }
  function job(t,o,link,why,kws,hits,status){
    var k=kws.map(function(x){return '<span class="kw'+(hits.indexOf(x)>-1?' hit':'')+'">'+x+'</span>';}).join('');
    return '<div class="job"><div class="top"><span class="jt">'+t+'</span><span class="jo">'+o+'</span>'+
      (status?'<span class="chip done" style="margin-left:auto"><span class="cdot"></span>'+status+'</span>':'')+'</div>'+
      '<div class="lnk">'+link+'</div><p class="why">'+why+'</p>'+
      '<div style="font-size:12.5px;color:var(--mute);margin-bottom:3px">Highlighted keywords are ones I can speak to with a specific example</div>'+
      '<div>'+k+'</div></div>';
  }
  function app(co,ro,d,st,stl,next,qs){
    var q=qs.length?'<ul class="qs">'+qs.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>':'';
    return '<div class="app"><div class="top"><span class="co">'+co+'</span><span class="ro">'+ro+'</span>'+
      '<span class="meta">'+d+'</span></div>'+
      '<div style="margin-top:7px">'+chip(st,stl)+'</div>'+
      '<div class="next"><b style="color:var(--navy)">Next:</b> '+next+q+'</div></div>';
  }

  /* ---------------------- render ---------------------- */
  var tabs=document.getElementById("tabs"), wrap=document.getElementById("wrap");

  V.forEach(function(d,i){
    var b=document.createElement("button");
    b.type="button"; b.dataset.i=i;
    b.innerHTML='<span class="tv">'+d.v+'</span><span class="tn">'+d.name+'</span>';
    tabs.appendChild(b);
  });

  function show(i){
    tabs.querySelectorAll("button").forEach(function(b,j){ b.classList.toggle("on", j===i); });
    wrap.innerHTML=V[i].build();
    window.scrollTo({top:0,behavior:"instant"});
  }

  tabs.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");
    if(b) show(+b.dataset.i);
  });

  /* Optional gating, set by the host page through the URL hash: #up=N shows
     version N, marks earlier versions completed, and disables later ones.
     With no hash, all four tabs are open (stand-alone behavior). */
  var DONE=["5/9/27","5/25/29","10/1/29",""];
  function gate(){
    var m=/up=([1-4])/.exec(location.hash), up=m?+m[1]:null;
    tabs.querySelectorAll("button").forEach(function(b,j){
      var td=b.querySelector(".td"); if(td) td.remove();
      b.disabled = up!==null && j>=up;
      b.classList.toggle("done", up!==null && j<up-1);
      if(up!==null && j<up-1 && DONE[j]){
        b.insertAdjacentHTML("beforeend",'<span class="td">Completed '+DONE[j]+'</span>');
      }
    });
    show(up?up-1:0);
  }
  window.addEventListener("hashchange",gate);
  gate();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Career Plan Portfolio — v1.0 to v4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --navy:#15284B;
    --navy-hover:rgba(21,40,75,.72);
    --gold:#E7AB2A;
    --blue:#3CB4E5;
    --teal:#3BBFAD;
    --body:#595959;
    --mute:#8A8A8A;
    --rule:rgba(21,40,75,.14);
    --hair:rgba(21,40,75,.08);
    --t02:rgba(21,40,75,.03);
    --t05:rgba(21,40,75,.05);
    --t08:rgba(21,40,75,.08);
    --sans:"Libre Franklin","Segoe UI",Helvetica,Arial,sans-serif;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;background:#EEF0F3;color:var(--body);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
  }
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  /* ---------- version chooser (screen only) ---------- */
  .bar{
    position:sticky;top:0;z-index:20;background:var(--navy);
    padding:14px clamp(14px,3vw,28px);
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .bar .bt{
    color:#fff;font-size:.8125rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;margin-right:10px;
  }
  .bar button{
    background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);
    font:inherit;font-size:.8125rem;padding:7px 12px;cursor:pointer;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
  }
  .bar button:hover{background:rgba(255,255,255,.14);color:#fff;}
  .bar button.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600;}
  .bar .hint{margin-left:auto;font-size:.75rem;color:rgba(255,255,255,.55);}

  /* ---------- intro paragraph (screen only) ---------- */
  .intro{
    max-width:8.5in;margin:0 auto;
    padding:22px clamp(8px,2vw,24px) 0;
    font-size:.9375rem;line-height:1.6;color:var(--body,#595959);
  }
  .intro p{margin:0;}

  /* ---------- page ---------- */
  .sheet{padding:26px clamp(8px,2vw,24px) 60px;}
  .page{
    width:8.5in;min-height:11in;background:#fff;margin:0 auto 22px;
    padding:.46in .5in .4in;
    box-shadow:0 2px 14px rgba(21,40,75,.14);
    position:relative;
    font-size:9.6pt;line-height:1.45;
  }
  .pfoot{
    position:absolute;left:.5in;right:.5in;bottom:.22in;
    display:flex;justify-content:space-between;
    font-size:7pt;color:var(--mute);
    border-top:1px solid var(--hair);padding-top:5px;
  }

  /* ---------- identity band ---------- */
  .band{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:start;
    padding-bottom:12px;border-bottom:2px solid var(--navy);}
  .mono{
    width:62px;height:62px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:21pt;font-weight:600;letter-spacing:.02em;
  }
  .who h1{font-size:15pt;font-weight:600;color:#000;margin:0;line-height:1.15;letter-spacing:-.01em;}
  .who .maj{font-size:8.6pt;color:var(--body);margin:3px 0 0;}
  .who .hl{
    font-size:10pt;color:var(--navy);font-weight:500;line-height:1.35;
    margin:8px 0 0;padding-left:9px;border-left:3px solid var(--gold);
  }
  .who .hlwas{font-size:7.6pt;color:var(--mute);margin:4px 0 0 12px;}
  .who .hlwas s{text-decoration:line-through;}
  .vbox{text-align:right;}
  .vbox .vv{font-size:15pt;font-weight:600;color:var(--navy);line-height:1;}
  .vbox .vs{font-size:8pt;color:var(--body);margin-top:3px;}
  .vbox .vd{font-size:7.4pt;color:var(--mute);margin-top:2px;}

  /* ---------- section furniture ---------- */
  h2.sec{
    font-size:7.4pt;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
    color:var(--navy);margin:16px 0 8px;padding-bottom:4px;
    border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  h2.sec .sn{font-weight:400;letter-spacing:0;text-transform:none;font-size:7.6pt;color:var(--mute);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .card{border:1px solid var(--rule);padding:9px 10px;break-inside:avoid;}
  .card.fill{background:var(--t02);}
  .ck{font-size:7pt;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:4px;}

  .tag{
    display:inline-block;font-size:6.4pt;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;padding:1px 5px;vertical-align:1px;
  }
  .tag.new{background:var(--gold);color:var(--navy);}
  .tag.rev{background:var(--t08);color:var(--navy);}
  .tag.kept{background:transparent;color:#AEB3BD;border:1px solid var(--hair);}
  .tag.drop{background:transparent;color:#B06A6A;border:1px solid rgba(176,106,106,.4);}

  .was{display:block;font-size:7.4pt;color:var(--mute);margin-top:3px;}
  .was s{text-decoration:line-through;}

  /* entered-value styling: looks keyed into a form */
  .fld{margin:0 0 7px;}
  .fld:last-child{margin-bottom:0;}
  .fld .lb{font-size:7.2pt;color:var(--mute);display:block;margin-bottom:2px;}
  .fld .vl{
    display:block;font-size:9pt;color:#1a1a1a;
    border-bottom:1px solid var(--hair);padding-bottom:3px;
  }
  .empty{
    border:1px dashed rgba(21,40,75,.22);background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(21,40,75,.025) 5px,rgba(21,40,75,.025) 10px);
    padding:7px 9px;font-size:8pt;color:var(--mute);font-style:italic;
  }
  .course{font-weight:600;color:var(--navy);}

  /* ---------- likert ---------- */
  .lk{display:grid;grid-template-columns:1fr 128px 54px;gap:8px;align-items:center;
    padding:5px 0;border-top:1px solid var(--hair);font-size:8.4pt;}
  .lk:first-of-type{border-top:0;}
  .lk .lkl{line-height:1.3;}
  .lkbar{display:flex;gap:2px;}
  .lkbar i{flex:1;height:11px;background:var(--t08);display:block;}
  .lkbar i.f{background:var(--navy);}
  .lkbar i.g{background:var(--gold);}
  .lkv{font-size:7.6pt;color:var(--mute);text-align:right;white-space:nowrap;}
  .lkv b{color:var(--navy);font-size:8.6pt;}
  .up{color:#2E7D63;font-weight:600;}
  .dn{color:#B06A6A;font-weight:600;}
  .scalekey{font-size:6.8pt;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between;}

  /* ---------- pathways ---------- */
  .pw{border:1px solid var(--rule);border-top:3px solid var(--navy);padding:9px 10px;break-inside:avoid;}
  .pw.dropped{border-top-color:#C9A0A0;opacity:.72;}
  .pw.added{border-top-color:var(--gold);}
  .pw h3{font-size:9.4pt;font-weight:600;color:var(--navy);margin:0 0 2px;line-height:1.2;}
  .pw .cc{font-size:7.2pt;color:var(--mute);margin:0 0 7px;}
  .pw .stat{display:flex;gap:10px;align-items:flex-end;margin:7px 0;padding:6px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
  .pw .stat .num{font-size:12pt;font-weight:600;color:var(--navy);line-height:1;}
  .pw .stat .nl{font-size:6.8pt;color:var(--mute);display:block;margin-top:2px;}
  .pw .refl{font-size:8pt;line-height:1.4;margin:6px 0 0;}
  .pw .ttl{font-size:7.4pt;color:var(--mute);margin:6px 0 0;line-height:1.35;}

  /* ---------- tables ---------- */
  table.t{width:100%;border-collapse:collapse;font-size:8pt;}
  table.t th{
    text-align:left;font-size:6.9pt;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--navy);background:var(--t02);padding:5px 6px;border-bottom:1px solid var(--rule);
  }
  table.t td{padding:5px 6px;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.35;}
  table.t tr:last-child td{border-bottom:0;}
  .pill{display:inline-block;font-size:6.6pt;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;}
  .pill.ok{background:rgba(59,191,173,.22);color:#1C6A5E;}
  .pill.wait{background:var(--t08);color:var(--navy);}
  .pill.live{background:var(--gold);color:var(--navy);}
  .pill.no{background:rgba(176,106,106,.15);color:#8E4B4B;}
  .kw{display:inline-block;font-size:7pt;background:var(--t05);color:var(--navy);padding:1px 5px;margin:2px 3px 0 0;}
  .kw.hit{background:var(--gold);}

  /* ---------- misc ---------- */
  .meter{height:5px;background:var(--t08);margin-top:5px;}
  .meter i{display:block;height:5px;background:var(--gold);}
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0 4px;}
  .fn{background:var(--t02);border:1px solid var(--rule);padding:6px;text-align:center;}
  .fn b{display:block;font-size:13pt;color:var(--navy);line-height:1;}
  .fn span{display:block;font-size:6.6pt;color:var(--mute);margin-top:3px;letter-spacing:.05em;text-transform:uppercase;}
  .ql{font-size:7.6pt;color:var(--body);margin:3px 0 0;padding-left:10px;border-left:2px solid var(--gold);line-height:1.35;}
  .lnk{color:var(--navy);text-decoration:underline;text-underline-offset:2px;word-break:break-all;}
  .quote{background:var(--t02);border-left:3px solid var(--gold);padding:9px 11px;font-size:8.4pt;line-height:1.45;}
  .tl{display:grid;grid-template-columns:62px 1fr;gap:9px;font-size:8pt;}
  .tl .tdate{color:var(--navy);font-weight:600;font-size:7.6pt;padding-top:4px;}
  .tl .titem{border-top:1px solid var(--hair);padding:4px 0;}
  .two{columns:2;column-gap:14px;}
  .two > *{break-inside:avoid;}

  @media print{
    body{background:#fff;}
    .bar,.intro{display:none;}
    .sheet{padding:0;}
    .page{box-shadow:none;margin:0;page-break-after:always;width:auto;min-height:0;}
    @page{size:letter;margin:.4in;}
  }
  @media (max-width:950px){
    .page{width:100%;min-height:0;padding:20px;}
  }
</style>
</head>

  /* ===================== rendering helpers ===================== */
  var E=function(s){return String(s==null?"":s);};

  function tagEl(k){
    var m={new:"New",rev:"Revised",kept:"Carried forward",drop:"Dropped",added:"Added"};
    return k?'<span class="tag '+k+'">'+m[k]+'</span> ':'';
  }

  function spark(arr,w,h){
    w=w||70;h=h||18;
    var mn=Math.min.apply(null,arr), mx=Math.max.apply(null,arr), r=(mx-mn)||1;
    var pts=arr.map(function(v,i){
      return (i*(w/(arr.length-1))).toFixed(1)+","+(h-((v-mn)/r)*(h-3)-1.5).toFixed(1);
    }).join(" ");
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
      '<polyline points="'+pts+'" fill="none" stroke="#E7AB2A" stroke-width="1.6"/>'+
      '<circle cx="'+w+'" cy="'+(h-((arr[arr.length-1]-mn)/r)*(h-3)-1.5).toFixed(1)+'" r="2" fill="#15284B"/></svg>';
  }

  function likert(sec){
    var h='<h2 class="sec">Self-efficacy check<span class="sn">'+E(sec.note)+'</span></h2>';
    sec.items.forEach(function(it){
      var seg="";
      for(var i=1;i<=5;i++){
        var cls = i<=it.v ? (it.p!=null && i>it.p ? "f g":"f") : "";
        seg+='<i class="'+cls+'"></i>';
      }
      var d="";
      if(it.p!=null){
        var diff=it.v-it.p;
        d = diff>0 ? '<span class="up">▲'+diff+'</span>' : diff<0 ? '<span class="dn">▼'+Math.abs(diff)+'</span>' : '<span style="color:#AEB3BD">—</span>';
      } else { d='<span class="tag new" style="font-size:5.8pt">New</span>'; }
      h+='<div class="lk"><span class="lkl">'+E(it.t)+'</span>'+
         '<span class="lkbar">'+seg+'</span>'+
         '<span class="lkv"><b>'+it.v+'</b>/5 '+d+'</span></div>';
    });
    h+='<div class="scalekey"><span>1 · '+SCALE[0]+'</span><span>5 · '+SCALE[4]+'</span></div>';
    return h;
  }

  function band(v){
    return '<div class="band">'+
      '<div class="mono">'+STUDENT.initials+'</div>'+
      '<div class="who">'+
        '<h1>'+STUDENT.name+'</h1>'+
        '<p class="maj">'+STUDENT.major+' · '+STUDENT.minor+' · '+STUDENT.classYear+'</p>'+
        '<p class="hl">'+E(v.headline)+'</p>'+
        (v.headlineWas?'<p class="hlwas">Revised from: <s>'+E(v.headlineWas)+'</s></p>':'')+
      '</div>'+
      '<div class="vbox"><div class="vv">'+v.v+'</div><div class="vs">'+E(v.stage)+'</div>'+
        '<div class="vd">'+E(v.term)+'<br>'+E(v.date)+'</div>'+
        '<div class="meter" style="width:96px"><i style="width:'+v.complete+'%"></i></div>'+
        '<div class="vd">'+v.complete+'% complete</div></div>'+
    '</div>';
  }

  function pathways(v){
    var h='<h2 class="sec">Career pathways under consideration<span class="sn">Selected from the Suffolk Career Pathways site</span></h2><div class="grid3">';
    v.pathways.forEach(function(p){
      var d=PW[p.id];
      h+='<div class="pw '+(p.state==="drop"?"dropped":p.state==="added"?"added":"")+'">'+
        tagEl(p.state)+(p.rank?'<span class="ck" style="display:inline">'+p.rank+'</span>':'')+
        '<h3>'+d.name+'</h3>'+
        '<p class="cc">'+d.cc+'</p>'+
        '<div class="stat"><div><span class="num">'+d.earn+'</span><span class="nl">'+d.earnNote+'</span></div>'+
        '<div style="margin-left:auto;text-align:right">'+spark(d.trend)+'<span class="nl">'+d.trendNote+'</span></div></div>'+
        '<p class="refl">'+E(p.refl)+'</p>'+
        (p.reflWas?'<span class="was">Previously: <s>'+E(p.reflWas)+'</s></span>':'')+
        '<p class="ttl"><b>Entry titles:</b> '+d.titles+'</p>'+
      '</div>';
    });
    return h+'</div><p class="scalekey"><span>Earnings and outlook entered by the student from BLS and Massachusetts occupational data; not supplied by the pathways site.</span></p>';
  }

  function wblIntent(v){
    return '<h2 class="sec">Work-based learning — intention<span class="sn">Stated before the requirement comes due</span></h2>'+
      '<div class="grid2"><div class="card fill">'+
      '<div class="fld"><span class="lb">When I intend to complete it</span><span class="vl">'+E(v.wbl.term)+'</span></div>'+
      '<div class="fld"><span class="lb">Types of roles I would apply to</span><span class="vl">'+E(v.wbl.roles)+'</span></div></div>'+
      '<div class="card"><span class="ck">How I will prepare in the meantime</span><p style="margin:0;font-size:8.4pt;line-height:1.45">'+E(v.wbl.prep)+'</p></div></div>';
  }

  function wblConfirmed(v){
    var w=v.wblConfirmed;
    return '<h2 class="sec">Work-based learning — confirmed<span class="sn">Qualifying experience, verified</span></h2>'+
      '<div class="card fill"><div class="grid2">'+
      '<div><div class="fld"><span class="lb">Organization</span><span class="vl">'+w.org+'</span></div>'+
      '<div class="fld"><span class="lb">Role</span><span class="vl">'+w.role+'</span></div></div>'+
      '<div><div class="fld"><span class="lb">Dates and terms</span><span class="vl">'+w.dates+'</span></div>'+
      '<div class="fld"><span class="lb">Qualifying pathway</span><span class="vl">'+w.type+'</span></div></div></div>'+
      '<div class="fld" style="margin-top:7px"><span class="lb">How I found it</span><span class="vl">'+w.how+'</span></div></div>';
  }

  function wblGoals(v){
    var h='<h2 class="sec">My three learning goals for this experience<span class="sn">Written before the start date</span></h2><div class="grid3">';
    v.wblGoals.forEach(function(g,i){
      h+='<div class="card"><span class="ck">Goal '+(i+1)+'</span><p style="margin:0 0 6px;font-size:8.4pt;line-height:1.4;color:#1a1a1a">'+g.g+'</p>'+
         '<span class="ck">How I will pursue it</span><p style="margin:0;font-size:7.8pt;line-height:1.4">'+g.how+'</p></div>';
    });
    return h+'</div>';
  }

  function goals(v){
    var h='<h2 class="sec">Career plan goals<span class="sn">Action selected from a list · student-set deadline</span></h2><table class="t">'+
      '<tr><th style="width:34%">Action</th><th>Detail</th><th style="width:76px">Deadline</th><th style="width:58px">Status</th></tr>';
    v.goals.forEach(function(g){
      h+='<tr><td>'+g.a+'</td><td>'+g.d+'</td><td>'+g.due+'</td><td><span class="pill '+(g.s==="done"?"ok":"wait")+'">'+(g.s==="done"?"Done":"Open")+'</span></td></tr>';
    });
    return h+'</table>';
  }

  function advising(v){
    var a=v.advising;
    var h='<h2 class="sec">Advising and events<span class="sn">'+a.count+' appointments to date · last contact '+a.last+'</span></h2><div class="grid2">';
    h+='<div><span class="ck">Previous</span><div class="tl">';
    a.past.forEach(function(p){ h+='<div class="tdate">'+p.d+'</div><div class="titem"><b style="color:#1a1a1a;font-weight:500">'+p.w+'</b><br>'+p.t+'</div>'; });
    h+='</div></div><div><span class="ck">Upcoming</span><div class="tl">';
    a.upcoming.forEach(function(p){ h+='<div class="tdate">'+p.d+'</div><div class="titem"><b style="color:#1a1a1a;font-weight:500">'+p.w+'</b><br>'+p.t+'</div>'; });
    return h+'</div></div></div>';
  }

  function network(v,key,title,note){
    var list=v[key||"network"];
    var h='<h2 class="sec">'+(title||"My network")+'<span class="sn">'+(note||(list.length+" contacts · how I will keep each relationship going"))+'</span></h2>'+
      '<table class="t"><tr><th>Name</th><th>Role</th><th>How we met</th><th style="width:30%">How I will stay in touch</th><th style="width:66px">Last contact</th></tr>';
    list.forEach(function(p){
      h+='<tr><td>'+(p.chg?tagEl(p.chg):'')+'<b style="color:#1a1a1a;font-weight:500">'+p.n+'</b></td>'+
         '<td>'+p.r+'<br><span style="color:#8A8A8A">'+p.o+'</span></td><td>'+p.m+'</td><td>'+p.c+'</td><td>'+p.l+'</td></tr>';
    });
    return h+'</table>';
  }

  function interview(v){
    var h='<h2 class="sec">Interview responses, drafted<span class="sn">Saved answers the student revises over time</span></h2>';
    v.interview.forEach(function(q){
      h+='<div class="card" style="margin-bottom:7px"><span class="ck">'+q.q+'</span>';
      if(q.a){
        h+='<p style="margin:0;font-size:8.3pt;line-height:1.45;color:#1a1a1a">'+q.a+'</p>';
        if(q.was) h+='<span class="was">Earlier answer: <s>'+q.was+'</s></span>';
      } else {
        h+='<div class="empty">No response entered yet — this prompt stays open until the student answers it.</div>';
      }
      h+='</div>';
    });
    return h;
  }

  function jobs(v){
    var h='<h2 class="sec">Saved postings<span class="sn">Pasted from Handshake · why it interests me, and what I can speak to</span></h2>';
    v.jobs.forEach(function(j){
      h+='<div class="card" style="margin-bottom:7px"><div style="display:flex;gap:10px;align-items:baseline">'+
        '<b style="font-size:9pt;color:var(--navy)">'+j.t+'</b>'+
        '<span style="font-size:8pt">'+j.o+'</span>'+
        (j.status?'<span class="pill ok" style="margin-left:auto">'+j.status+'</span>':'')+'</div>'+
        '<div style="font-size:7.2pt;margin:2px 0 5px"><span class="lnk">'+j.link+'</span></div>'+
        '<p style="margin:0 0 5px;font-size:8.2pt;line-height:1.4">'+j.why+'</p>'+
        '<span class="ck">Keywords and skills from the posting — highlighted ones I can speak to with a specific example</span><div>';
      j.kw.forEach(function(k){
        h+='<span class="kw'+((j.hits||[]).indexOf(k)>-1?' hit':'')+'">'+k+'</span>';
      });
      h+='</div></div>';
    });
    return h;
  }

  function reflection(v){
    var r=v.reflection;
    var h='<h2 class="sec">Reflection on work-based learning<span class="sn">Revising the plan, not restarting it</span></h2>'+
      '<div class="quote"><span class="ck">'+r.prompt+'</span>'+r.text+'</div>'+
      '<div style="margin-top:9px"><span class="ck">What changed in this version as a result</span><table class="t">';
    r.changed.forEach(function(c){ h+='<tr><td>'+c+'</td></tr>'; });
    return h+'</table></div>';
  }

  function targets(v){
    var t=v.targets;
    var h='<h2 class="sec">What I am pursuing after graduation<span class="sn">Narrowed from the pathway work</span></h2><div class="grid2">';
    h+='<div><span class="ck">Target titles</span>';
    t.roles.forEach(function(r){
      h+='<div class="card" style="margin-bottom:6px"><b style="font-size:9pt;color:var(--navy)">'+r.t+'</b>'+
         '<p style="margin:3px 0 0;font-size:8pt;line-height:1.4">'+r.why+'</p></div>';
    });
    h+='</div><div><span class="ck">Organizations I am targeting</span><div class="card fill" style="margin-bottom:6px">';
    t.orgs.forEach(function(o){ h+='<span class="kw">'+o+'</span>'; });
    h+='</div><div class="fld"><span class="lb">Geography</span><span class="vl">'+t.geo+'</span></div>'+
       '<div class="fld"><span class="lb">Timing</span><span class="vl">'+t.timing+'</span></div></div></div>';
    return h;
  }

  function evals(v){
    var e=v.evals;
    return '<h2 class="sec">Evaluations<span class="sn">Self and supervisor, compared</span></h2>'+
      '<div class="grid2" style="margin-bottom:8px">'+
      '<div class="card fill"><span class="ck">My self-evaluation</span><span class="lnk" style="font-size:7.6pt">'+e.self+'</span></div>'+
      '<div class="card fill"><span class="ck">Supervisor evaluation — K. Whitlock</span><span class="lnk" style="font-size:7.6pt">'+e.sup+'</span></div></div>'+
      '<div class="quote"><span class="ck">'+e.prompt+'</span>'+e.text+'</div>';
  }

  function launchPlan(v){
    var h='<h2 class="sec">Plan from here to graduation<span class="sn">One year · return from work-based learning to first destination</span></h2><div class="tl">';
    v.launch.forEach(function(s){
      h+='<div class="tdate">'+s.d+'</div><div class="titem"><span class="kw" style="margin:0 6px 0 0">'+s.k+'</span>'+s.t+'</div>';
    });
    return h+'</div>';
  }

  function funnel(v){
    var f=v.funnel;
    var rows=[["applied","Applied"],["screen","Phone screen"],["interview","Interview"],["final","Final round"],["offer","Offer"]];
    var h='<h2 class="sec">Application activity<span class="sn">Live record · '+f.applied+' applications since December</span></h2><div class="funnel">';
    rows.forEach(function(r){ h+='<div class="fn"><b>'+f[r[0]]+'</b><span>'+r[1]+'</span></div>'; });
    return h+'</div>';
  }

  function appsTable(list,title,note){
    var h='<h2 class="sec">'+title+'<span class="sn">'+note+'</span></h2>'+
      '<table class="t"><tr><th style="width:21%">Organization</th><th style="width:21%">Role</th><th style="width:58px">Applied</th><th style="width:72px">Status</th><th>Next action, and what I want to ask</th></tr>';
    list.forEach(function(a){
      var q=a.q&&a.q.length ? a.q.map(function(x){return '<p class="ql">'+x+'</p>';}).join("") : "";
      h+='<tr><td><b style="color:#1a1a1a;font-weight:500">'+a.co+'</b></td><td>'+a.role+'</td><td>'+a.d+'</td>'+
         '<td><span class="pill '+a.stc+'">'+a.st+'</span></td>'+
         '<td>'+a.next+q+'</td></tr>';
    });
    return h+'</table>';
  }

  var SECTIONS={
    band:band,
    efficacy:function(v){return likert(v.efficacy);},
    pathways:pathways, wbl_intent:wblIntent,
    wbl_confirmed:wblConfirmed, wbl_goals:wblGoals, goals:goals, advising:advising,
    network:function(v){return network(v);},
    network_wbl:function(v){return network(v,"networkWbl","People I added during work-based learning","New contacts · how I will maintain each relationship");},
    interview:interview, jobs:jobs, reflection:reflection, targets:targets,
    evals:evals, launch_plan:launchPlan, funnel:funnel,
    applications:function(v){return appsTable(v.apps,"Applications — active","Sortable in the live tool · follow-up dates drive reminders");},
    applications2:function(v){return appsTable(v.apps2,"Applications — continued","");}
  };

  /* ===================== render ===================== */
  var sheet=document.getElementById("sheet"), bar=document.getElementById("bar"), hint=document.getElementById("hint"), intro=document.getElementById("intro");

  VERSIONS.forEach(function(v,i){
    var b=document.createElement("button");
    b.type="button"; b.dataset.i=i;
    b.textContent=v.v+" · "+v.stage;
    bar.insertBefore(b, hint);
  });

  function render(i){
    var v=VERSIONS[i];
    bar.querySelectorAll("button").forEach(function(b,j){ b.classList.toggle("on", j===i); });
    hint.textContent="Letter size · "+v.pages.length+" pages · print or save as PDF";
    intro.firstChild.textContent=INTROS[i]||"";
    var html="";
    v.pages.forEach(function(secs,pi){
      html+='<div class="page">';
      secs.forEach(function(s){ html+=SECTIONS[s](v); });
      html+='<div class="pfoot"><span>'+STUDENT.name+' · '+STUDENT.id+' · Career Plan '+v.v+'</span>'+
            '<span>'+v.stage+'</span><span>Page '+(pi+1)+' of '+v.pages.length+'</span></div>';
      html+='</div>';
    });
    sheet.innerHTML=html;
    window.scrollTo({top:0,behavior:"instant"});
  }

  bar.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");
    if(b) render(+b.dataset.i);
  });

  render(0);
})();
</script>
</body>
</html>

</body></html>
